<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="70%" stop-color="#14100E"/>
      <stop offset="100%" stop-color="#0A0807"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.6"/>
  <!-- Mahjong Tile Base -->
  <rect x="156" y="116" width="200" height="280" rx="24" fill="#FBF8F1" stroke="#D1C4B0" stroke-width="6"/>
  <rect x="166" y="126" width="180" height="260" rx="18" fill="#F4EDE0"/>
  <!-- Red Dragon Character 中 -->
  <path d="M236 170 H276 V224 H314 V260 H276 V350 H236 V260 H198 V224 H236 Z" fill="#DC2626"/>
  <rect x="198" y="224" width="116" height="36" fill="none" stroke="#B91C1C" stroke-width="4"/>
  <!-- Decorative Floating Card Diamond & Spades -->
  <text x="96" y="180" font-size="52" fill="#F59E0B" filter="url(#glow)">♠</text>
  <text x="370" y="370" font-size="52" fill="#EF4444" filter="url(#glow)">♦</text>
  <!-- Seal Stamp -->
  <circle cx="256" cy="430" r="16" fill="url(#gold)"/>
  <text x="256" y="436" font-size="16" font-weight="bold" fill="#1C1613" text-anchor="middle" font-family="serif">雀</text>
</svg>
