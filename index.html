  <body class="bg-[#12100E] text-[#F5EFE6] antialiased selection:bg-amber-600/30 selection:text-amber-200">
    <div id="app"></div>
    <script>
      // 预先同步加载内置在 APK 内的本地服务器配置 (0毫秒本地加载，保障原生环境下立即连通 .env 目标服务器)
      (function() {
        try {
          var isNative = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:' || window.location.protocol === 'capacitor:';
          if (isNative) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/app-config.json', false);
            xhr.send(null);
            if (xhr.status === 200 || xhr.status === 0) {
              window.__APP_SERVER_CONFIG__ = JSON.parse(xhr.responseText);
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
